name: Unpack Hammer map

on:
  push:
    paths:
      - 'map/_upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild map source
        shell: bash
        run: |
          cat map/_upload/part* > /tmp/gm_zcity_frost.vmf.gz.b64
          base64 -d /tmp/gm_zcity_frost.vmf.gz.b64 > /tmp/gm_zcity_frost.vmf.gz
          gzip -dc /tmp/gm_zcity_frost.vmf.gz > map/gm_zcity_frost.vmf
          rm -rf map/_upload
      - name: Commit map source
        shell: bash
        run: |
          git config user.name "zcity-frost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add map/gm_zcity_frost.vmf map/_upload
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Hammer map source"
          git push
